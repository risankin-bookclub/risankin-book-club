<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — Рисанкин Книжный Клуб</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4eee2;color:#30291f;font-family:Georgia,'Times New Roman',serif}header{padding:24px max(20px,calc((100% - 950px)/2));border-bottom:1px solid #c8bda9;display:flex;align-items:center;justify-content:space-between;gap:20px}header a{color:inherit}header strong{letter-spacing:.13em}main{max-width:490px;margin:65px auto;padding:0 22px 80px}h1{font-size:clamp(32px,7vw,48px);font-weight:normal;text-align:center;margin:0 0 8px}p.sub{text-align:center;color:#716657;line-height:1.5;margin-bottom:34px}.panel{background:#fffaf0;border:1px solid #d5c8b4;padding:30px;box-shadow:6px 6px 0 #e0d5c3}.tabs{display:flex;gap:12px;margin-bottom:24px}.tabs button{flex:1;background:transparent;border:0;border-bottom:1px solid #b9ab96;padding:12px 5px;font:inherit;cursor:pointer}.tabs button.active{border-bottom:3px solid #392f24;font-weight:bold}label{display:block;margin:14px 0 7px;font-size:15px}input{width:100%;border:1px solid #c5b9a6;background:#fff;padding:13px;font-size:16px;border-radius:0}button.primary{width:100%;padding:14px;margin-top:24px;background:#342a21;color:white;border:0;font:inherit;cursor:pointer}button.secondary{padding:11px;background:transparent;border:1px solid #aa9c87;font:inherit;cursor:pointer}#message{margin-top:16px;line-height:1.5;white-space:pre-line}#profile{display:none;text-align:center}#profile p{overflow-wrap:anywhere}.hidden{display:none!important}.note{font-size:13px;color:#766b5d;line-height:1.5;margin-top:16px}button:disabled{opacity:.5;cursor:wait}</style></head><body><header><strong>РИСАНКИН КНИЖНЫЙ КЛУБ</strong><a href="index.html">← На главную</a></header><main><h1>Личный кабинет</h1><p class="sub">Твоё читательское пространство</p><div class="panel"><div id="auth"><div class="tabs"><button id="loginTab" class="active" type="button">Войти</button><button id="registerTab" type="button">Регистрация</button></div><form id="authForm"><div id="nameWrap" class="hidden"><label for="name">Имя или псевдоним</label><input id="name" autocomplete="nickname" maxlength="60"></div><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="email" required><label for="password">Пароль</label><input id="password" type="password" minlength="6" autocomplete="current-password" required><button id="submit" class="primary" type="submit">Войти</button></form><p class="note">Для регистрации потребуется email. Не используйте пароль от почты или других сервисов.</p></div><div id="profile"><h2>Добро пожаловать!</h2><p id="who"></p><p class="note">«Моя полка» появится здесь на следующем этапе.</p><button id="logout" class="secondary">Выйти</button></div><div id="message" role="status" aria-live="polite"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
(()=>{'use strict';const url='https://ucdbshgntaqtojsuzvqb.supabase.co',key='sb_publishable_4MG1e0_NkmBoFfV4o6-v4g_oAAeeDfv';const $=id=>document.getElementById(id),message=$('message');if(!window.supabase){message.textContent='Не удалось загрузить авторизацию. Проверьте соединение.';return;}const client=window.supabase.createClient(url,key);let mode='login';function setMode(next){mode=next;$('nameWrap').classList.toggle('hidden',mode!=='register');$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');$('submit').textContent=mode==='login'?'Войти':'Зарегистрироваться';$('password').autocomplete=mode==='login'?'current-password':'new-password';message.textContent='';}function render(user){$('auth').style.display=user?'none':'block';$('profile').style.display=user?'block':'none';$('who').textContent=user?(user.user_metadata?.display_name||user.email):'';}$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('authForm').onsubmit=async e=>{e.preventDefault();const btn=$('submit');btn.disabled=true;message.textContent='';try{const email=$('email').value.trim(),password=$('password').value;if(mode==='register'){const display_name=$('name').value.trim();if(!display_name)throw Error('Укажи имя или псевдоним.');const {data,error}=await client.auth.signUp({email,password,options:{data:{display_name},emailRedirectTo:new URL('account.html',location.href).href}});if(error)throw error;message.textContent=data.session?'Аккаунт создан.':'Проверь почту: если подтверждение включено, мы отправили письмо со ссылкой.';}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;message.textContent='';}}catch(err){message.textContent=err.message==='Invalid login credentials'?'Неверная почта или пароль.':err.message;}finally{btn.disabled=false;}};$('logout').onclick=async()=>{const {error}=await client.auth.signOut();if(error)message.textContent=error.message;};client.auth.onAuthStateChange((_event,session)=>render(session?.user));client.auth.getSession().then(({data})=>render(data.session?.user)).catch(()=>message.textContent='Не удалось проверить сессию.');})();
</script></body></html>
